name: Mahdi-Editor CI

# بناء APK تلقائيًا عند كل دفعة إلى main، وعند كل طلب دمج، وعند كل وسم إصدار (v*).
# الوسم v* ينشر إصدارًا جديدًا باسم ملف ثابت «Mahdi-Editor.apk» ليبقى رابط التنزيل الدائم صالحًا:
#   https://github.com/m777m44/Mahdi-editor/releases/latest/download/Mahdi-Editor.apk
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # طلبات الدمج تُبنى أيضًا، حتى يُتحقّق من نجاح التجميع قبل الدمج في main.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      use_cache:
        description: "استخدام ذاكرة Gradle المؤقتة / Use the Gradle cache"
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE }}
      PROPS_B64: ${{ secrets.PROP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode signing material (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/mahdi.keystore
          echo "$PROPS_B64" | base64 -d > /tmp/signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set build metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleCommunityRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          mkdir -p out
          # اسم الملف ثابت دائمًا: عليه يعتمد رابط «أحدث إصدار» في README
          cp app/build/outputs/apk/community/release/*.apk "out/Mahdi-Editor.apk"
          # نسخة إضافية باسم الإصدار، للرجوع إليها لاحقًا
          cp "out/Mahdi-Editor.apk" "out/Mahdi-Editor-v${APP_VERSION}.apk"
          ls -lh out

      # عند فشل التجميع في طلب دمج: انشر أسطر الخطأ كتعليق على الطلب،
      # حتى يراها من لا يملك صلاحية الوصول إلى سجلات Actions.
      - name: Report build errors on PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import re, os
          log_path = '/tmp/gradle.log'
          text = ''
          if os.path.exists(log_path):
              text = open(log_path, encoding='utf-8', errors='ignore').read()
          lines = text.splitlines()
          picked = []
          for i, line in enumerate(lines):
              if re.search(r'(^e: |^w: .*error|error:|FAILURE:|What went wrong|Caused by:|> Task .* FAILED)', line):
                  picked.append(line.strip())
          # أبقِ 120 سطرًا كحد أقصى مع إزالة التكرار
          seen, uniq = set(), []
          for l in picked:
              if l and l not in seen:
                  seen.add(l)
                  uniq.append(l)
          body = '\n'.join(uniq[:120]) or 'لم تُستخرج أسطر خطأ؛ راجع سجل التشغيل.'
          md = "### ❌ فشل التجميع\n\n```\n" + body[:60000] + "\n```\n"
          open('/tmp/errors.md', 'w', encoding='utf-8').write(md)
          print(md[:4000])
          PY
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/errors.md || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahdi-Editor-${{ env.SHORT_SHA }}
          path: out/Mahdi-Editor.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Mahdi-Editor ${{ github.ref_name }}
          body: |
            ## Mahdi-Editor ${{ github.ref_name }}

            محرر أكواد عربي بالكامل، مبنيّ من المصدر عبر GitHub Actions.

            ### التثبيت
            1. نزّل ملف `Mahdi-Editor.apk` من هذه الصفحة (أو من الرابط الدائم
               <https://github.com/m777m44/Mahdi-editor/releases/latest/download/Mahdi-Editor.apk>).
            2. اسمح بتثبيت التطبيقات من هذا المصدر إن طلب أندرويد ذلك.
            3. ثبّت التطبيق وافتحه.

            - المتطلبات: أندرويد 8.0 (API 26) أو أحدث.
            - الرخصة: GPLv3 — راجع ملف `NOTICE` في المستودع.
          files: |
            out/Mahdi-Editor.apk
            out/Mahdi-Editor-v${{ env.APP_VERSION }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Delete signing material
        if: always()
        run: rm -f /tmp/mahdi.keystore /tmp/signing.properties
